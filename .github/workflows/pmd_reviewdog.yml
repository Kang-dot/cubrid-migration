name: PMD with SARIF (only changed files)

on:
  push:
    branches: [ "pmd-test" ]

jobs:
  pmd-sarif:
    runs-on: ubuntu-latest
    env:
      PMD_HOME: ./pmd/pmd-bin-6.55.0
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download and install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b . latest
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Download PMD
        run: |
          curl -L -o pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip
          unzip pmd.zip -d pmd

      - name: Generate .java file list (only changed in PR)
        run: |
          git fetch origin develop
          git diff --name-only origin/develop...HEAD -- '*.java' > filelist.txt
          cat filelist.txt

      - name: Run PMD if file list is not empty
        run: |
          if [ -s filelist.txt ]; then
            $PMD_HOME/bin/run.sh pmd \
              --file-list filelist.txt \
              --dir . \
              --rulesets rulesets/java/quickstart.xml \
              --format sarif \
              --report-file pmd-report.sarif || true
          else
            echo "No Java files changed, skipping PMD"
            echo "{}" > pmd-report.sarif
          fi

          cat pmd-report.txt | ./reviewdog \
            -f=sarif \
            -name="PMD" \
            -reporter=github-pr-check \
            -level=warning \
            -fail-level=any

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
